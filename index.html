<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ốp Lưng & Vỏ Bảo Vệ - Phụ Kiện iPhone</title>
  <link rel="stylesheet" href="css/list.css">
</head>

<body>
  <div id="site-header"></div>

  <header class="title">
    <p class="eyebrow">Phụ Kiện</p>
    <h1 id="pagetitle">iPhone</h1>
  </header>
<nav id="subnav" class="subnav" aria-label="iPhone"></nav>

  <div class="filters">
    <div class="filters-in">
      <button id="mfilter" class="pill mfilter" type="button" aria-expanded="false">Bộ lọc<span id="fcount" class="fcount"></span></button>
      <button id="freset" class="freset" type="button">Đặt lại</button>
      <div id="pills" class="pills"></div>
      <div class="sort">Sắp Xếp Theo:
        <button id="sortbtn" type="button" aria-haspopup="listbox" aria-expanded="false">Nổi bật</button>
        <ul id="sortlist" class="sortlist" role="listbox" hidden></ul>
      </div>
    </div>
    <div id="panel" class="panel" hidden></div>
  </div>

  <main>
    <div id="grid" class="grid"></div>
    <div id="wnav" class="wnav">
      <button id="wprev" type="button" aria-label="Sản phẩm trước"><svg width="9" height="14" viewBox="0 0 10 16"><path d="M8 2L2 8l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="wnext" type="button" aria-label="Sản phẩm sau"><svg width="9" height="14" viewBox="0 0 10 16"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="pager">
      <button id="prev" aria-label="Trang trước">&#8249;</button>
      <span id="pageinfo">1 of 2</span>
      <button id="next" aria-label="Trang sau">&#8250;</button>
    </div>
  </main>

  <div id="site-footer"></div>

<!-- loader nạp lần lượt: data-before -> dữ liệu data/ -> data-after -->
<script src="js/common/loader.js"
  data-before="js/common/layout.js,js/common/nav.js,js/list/subnav.js,js/list/filters.js"
  data-after="js/list/app.js,js/common/title.js,js/list/open-detail.js"></script>
</body>

</html>
